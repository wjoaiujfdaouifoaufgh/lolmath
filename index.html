<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lolmath</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f0;
    --text-dark: #1a2e1e;
    --accent2: #2e8b57;
    --pill-bg: rgba(255,255,255,0.55);
    --pill-border: rgba(60,120,80,0.18);
    --pill-hover: rgba(255,255,255,0.85);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    overflow: hidden;
    cursor: default;
  }

  #topo {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  .particles { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .particle {
    position: absolute;
    border-radius: 50%;
    background: #888;
    opacity: 0;
    animation: twinkle var(--dur) ease-in-out infinite var(--delay);
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.4); }
    50%       { opacity: 0.35; transform: scale(1); }
  }

  /* ── Hero ── */
  .hero {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 2.4rem;
  }
  .logo {
    font-family: 'Syne', sans-serif;
    font-size: clamp(3rem, 8vw, 6rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    color: #111;
    user-select: none;
    animation: fadeDown 0.9s cubic-bezier(.22,1,.36,1) both;
  }
  .nav {
    display: flex;
    gap: 0.75rem;
    animation: fadeUp 0.9s 0.25s cubic-bezier(.22,1,.36,1) both;
  }
  .pill {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    padding: 0.65rem 1.5rem;
    border-radius: 999px;
    background: var(--pill-bg);
    border: 1.5px solid var(--pill-border);
    color: var(--text-dark);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    backdrop-filter: blur(14px) saturate(1.4);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);
    transition: background 0.2s, box-shadow 0.2s, transform 0.15s;
    text-decoration: none;
  }
  .pill:hover {
    background: var(--pill-hover);
    box-shadow: 0 6px 28px rgba(46,139,87,0.13);
    transform: translateY(-2px);
  }
  .pill:active { transform: translateY(0); }
  .pill svg { width: 16px; height: 16px; opacity: 0.75; }

  /* ── Games overlay ── */
  .games-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(245,245,240,0.93);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 3rem 2rem 2rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
    overflow-y: auto;
  }
  .games-overlay.open { opacity: 1; pointer-events: all; }

  .overlay-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 1100px;
    margin-bottom: 2rem;
  }
  .overlay-title {
    font-family: 'Syne', sans-serif;
    font-size: 1.7rem;
    font-weight: 700;
    color: var(--text-dark);
  }
  .close-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-dark);
    opacity: 0.45;
    transition: opacity 0.2s;
    padding: 0.4rem;
  }
  .close-btn:hover { opacity: 1; }

  .search-wrap { width: 100%; max-width: 1100px; margin-bottom: 1.5rem; }
  .search-input {
    width: 100%;
    padding: 0.8rem 1.4rem;
    border-radius: 999px;
    border: 1.5px solid var(--pill-border);
    background: rgba(255,255,255,0.7);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    color: var(--text-dark);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-input:focus {
    border-color: var(--accent2);
    box-shadow: 0 0 0 3px rgba(46,139,87,0.12);
  }

  .category-tabs {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-bottom: 2rem;
    width: 100%;
    max-width: 1100px;
  }
  .tab {
    padding: 0.4rem 1rem;
    border-radius: 999px;
    border: 1.5px solid var(--pill-border);
    background: transparent;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem;
    color: var(--text-dark);
    cursor: pointer;
    transition: background 0.18s, color 0.18s;
  }
  .tab.active, .tab:hover {
    background: var(--accent2);
    color: #fff;
    border-color: var(--accent2);
  }

  /* ── Game cards ── */
  .games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 1.25rem;
    width: 100%;
    max-width: 1100px;
    padding-bottom: 2rem;
  }

  .game-card {
    background: rgba(255,255,255,0.7);
    border: 1.5px solid var(--pill-border);
    border-radius: 18px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
  }
  .game-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 36px rgba(46,139,87,0.16);
  }
  .game-card.hidden { display: none; }

  /* thumbnail area */
  .card-thumb {
    width: 100%;
    aspect-ratio: 16/9;
    background: #e8ede9;
    overflow: hidden;
    position: relative;
  }
  .card-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.3s ease;
  }
  .game-card:hover .card-thumb img { transform: scale(1.04); }
  /* fallback when no image */
  .card-thumb .thumb-fallback {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.4rem;
    background: linear-gradient(135deg, #e8ede9 0%, #d4e0d6 100%);
  }

  .card-info {
    padding: 0.9rem 1rem 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }
  .game-name {
    font-family: 'Syne', sans-serif;
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--text-dark);
  }
  .game-category {
    font-size: 0.72rem;
    color: var(--accent2);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 500;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<canvas id="topo"></canvas>
<div class="particles" id="particles"></div>

<div class="hero">
  <div class="logo">lolmath</div>
  <nav class="nav">
    <button class="pill" onclick="openGames()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      browse study
    </button>
  </nav>
</div>

<div class="games-overlay" id="gamesOverlay">
  <div class="overlay-header">
    <div class="overlay-title">browse study</div>
    <button class="close-btn" onclick="closeGames()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <div class="search-wrap">
    <input class="search-input" id="searchInput" placeholder="search games..." oninput="filterGames()" />
  </div>

  <div class="category-tabs">
    <button class="tab active" onclick="setCategory('all',this)">All</button>
    <button class="tab" onclick="setCategory('action',this)">Action</button>
    <button class="tab" onclick="setCategory('puzzle',this)">Puzzle</button>
    <button class="tab" onclick="setCategory('math',this)">Math</button>
    <button class="tab" onclick="setCategory('strategy',this)">Strategy</button>
    <button class="tab" onclick="setCategory('arcade',this)">Arcade</button>
  </div>

  <div class="games-grid" id="gamesGrid"></div>
</div>

<script>
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// GAME LIST — add games here!
// Each entry needs:
//   id:   number — links to {id}.html (game file) and {id}.png (thumbnail)
//   name: display name
//   cat:  category for filtering
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const GAMES = [
  { id: 1, name: 'FNAF 1',  cat: 'Horror'  },
  { id: 2, name: 'FNAF 2',  cat: 'Horror'  },
  { id: 3, name: 'FNAF 3',  cat: 'Horror'  },
  { id: 4, name: 'FNAF 4',  cat: 'Horror'  },
];

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

let currentCategory = 'all';

function buildGrid() {
  const grid = document.getElementById('gamesGrid');
  grid.innerHTML = '';
  GAMES.forEach(g => {
    const card = document.createElement('div');
    card.className = 'game-card';
    card.dataset.cat = g.cat;
    card.dataset.name = g.name.toLowerCase();

    card.innerHTML = `
      <div class="card-thumb">
        <img src="${g.id}.png" alt="${g.name}"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="thumb-fallback" style="display:none">🎮</div>
      </div>
      <div class="card-info">
        <div class="game-name">${g.name}</div>
        <div class="game-category">${g.cat}</div>
      </div>
    `;

    card.addEventListener('click', () => {
      window.location.href = `viewer.html?game=${g.id}&name=${encodeURIComponent(g.name)}`;
    });

    grid.appendChild(card);
  });
}

function filterGames() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  document.querySelectorAll('.game-card').forEach(card => {
    const matchQ   = card.dataset.name.includes(q);
    const matchCat = currentCategory === 'all' || card.dataset.cat === currentCategory;
    card.classList.toggle('hidden', !(matchQ && matchCat));
  });
}

function setCategory(cat, btn) {
  currentCategory = cat;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  filterGames();
}

function openGames()  { document.getElementById('gamesOverlay').classList.add('open'); }
function closeGames() { document.getElementById('gamesOverlay').classList.remove('open'); }

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeGames(); });

buildGrid();

// ── Topographic canvas ──
(function () {
  const canvas = document.getElementById('topo');
  const ctx = canvas.getContext('2d');
  let W, H, t = 0;
  function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize);
  resize();

  function noise(x, y, t) {
    return (
      Math.sin(x * 0.009 + t * 0.22 + Math.cos(y * 0.007 + t * 0.13)) +
      Math.sin(y * 0.011 - t * 0.18 + Math.cos(x * 0.008 - t * 0.09)) * 0.9 +
      Math.sin((x + y) * 0.007 + t * 0.15) * 0.7 +
      Math.cos(x * 0.005 - y * 0.009 + t * 0.11) * 0.6
    ) / 3.2;
  }

  const LEVELS = 18, STEP = 6;
  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#f5f5f0';
    ctx.fillRect(0, 0, W, H);
    const cols = Math.ceil(W / STEP) + 1, rows = Math.ceil(H / STEP) + 1;
    const field = [];
    for (let r = 0; r < rows; r++) { field[r] = []; for (let c = 0; c < cols; c++) field[r][c] = noise(c * STEP, r * STEP, t); }

    ctx.strokeStyle = 'rgba(30,80,50,0.16)';
    ctx.lineWidth = 1.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    for (let lvl = 0; lvl < LEVELS; lvl++) {
      const threshold = -1 + (lvl / (LEVELS - 1)) * 2;
      ctx.beginPath();
      for (let r = 0; r < rows - 1; r++) {
        for (let c = 0; c < cols - 1; c++) {
          const v = [field[r][c], field[r][c+1], field[r+1][c+1], field[r+1][c]];
          const x0 = c*STEP, y0 = r*STEP, x1 = x0+STEP, y1 = y0+STEP;
          function lerp(a, b, va, vb) { return Math.abs(vb-va)<0.0001?a:a+(threshold-va)/(vb-va)*(b-a); }
          const idx = (v[0]>threshold?8:0)|(v[1]>threshold?4:0)|(v[2]>threshold?2:0)|(v[3]>threshold?1:0);
          const pts = { top:[lerp(x0,x1,v[0],v[1]),y0], right:[x1,lerp(y0,y1,v[1],v[2])], bottom:[lerp(x0,x1,v[3],v[2]),y1], left:[x0,lerp(y0,y1,v[0],v[3])] };
          const lines = {1:[pts.bottom,pts.left],2:[pts.right,pts.bottom],3:[pts.right,pts.left],4:[pts.top,pts.right],5:[pts.top,pts.right,pts.bottom,pts.left],6:[pts.top,pts.bottom],7:[pts.top,pts.left],8:[pts.top,pts.left],9:[pts.top,pts.bottom],10:[pts.top,pts.right,pts.bottom,pts.left],11:[pts.top,pts.right],12:[pts.right,pts.left],13:[pts.right,pts.bottom],14:[pts.bottom,pts.left]};
          const seg = lines[idx]; if (!seg) continue;
          if (idx===5||idx===10) { ctx.moveTo(seg[0][0],seg[0][1]); ctx.lineTo(seg[1][0],seg[1][1]); ctx.moveTo(seg[2][0],seg[2][1]); ctx.lineTo(seg[3][0],seg[3][1]); }
          else { ctx.moveTo(seg[0][0],seg[0][1]); ctx.lineTo(seg[1][0],seg[1][1]); }
        }
      }
      ctx.stroke();
    }
    t += 0.008;
    requestAnimationFrame(draw);
  }
  draw();
})();

// ── Particles ──
(function () {
  const container = document.getElementById('particles');
  for (let i = 0; i < 22; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 4 + 2;
    p.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--dur:${3+Math.random()*5}s;--delay:${-Math.random()*8}s;`;
    container.appendChild(p);
  }
})();
</script>
</body>
</html>
